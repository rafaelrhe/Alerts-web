<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskMonitor Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>RiskMonitor</h1>
  </header>

  <main>
    <section class="card">
      <h2>Estado del radar</h2>
      <div id="status-grid" class="status-grid"></div>
    </section>

    <section id="executive-hero" class="card card-hero card-primary" hidden>
      <p class="eyebrow">Lectura principal</p>
      <h2 id="exec-title">Situación actual</h2>
      <p id="exec-main-front" class="exec-main-front" hidden></p>
      <p id="exec-status" class="exec-status" hidden></p>
      <p id="exec-summary" class="exec-summary"></p>
      <h3 class="hero-subtitle">Claves del momento</h3>
      <ul id="exec-points" class="exec-points"></ul>
      <div class="hero-watch">
        <h3 class="hero-subtitle">Qué vigilar</h3>
        <ul id="hero-watch-list" class="hero-watch-list"></ul>
      </div>
    </section>

    <section id="front-story-card" class="card card-secondary" hidden>
      <h2>Historia reciente del frente</h2>
      <p id="front-story-title" class="front-story-title"></p>
      <ul id="front-story-list" class="timeline-list"></ul>
    </section>

    <section class="card card-secondary">
      <h2>Frentes abiertos</h2>
      <ul id="episodes-list" class="list"></ul>
    </section>

    <section id="daily-report-card" class="card card-editorial" hidden>
      <h2>Último informe diario</h2>
      <div id="daily-report-content"></div>
    </section>

    <section class="card">
      <h2>Alertas recientes</h2>
      <ul id="alerts-list" class="list"></ul>
    </section>

    <section class="card card-technical">
      <h2>Estado técnico</h2>
      <ul id="review-list" class="list"></ul>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
