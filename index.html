<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskMonitor Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>RiskMonitor</h1>
  </header>

  <main>
    <section class="card card-secondary">
      <h2>Estado del radar</h2>
      <div id="status-grid" class="status-grid"></div>
    </section>

    <section id="executive-hero" class="card card-hero card-primary" hidden>
      <p class="eyebrow">Front principal</p>
      <h2 id="exec-title">Situación principal</h2>
      <p id="exec-summary" class="exec-summary"></p>
      <ul id="exec-points" class="exec-points"></ul>
    </section>

    <section id="branches-card" class="card card-secondary" hidden>
      <h2>Ramificaciones del frente principal</h2>
      <ul id="branches-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Actividad reciente</h2>
      <ul id="activity-list" class="list"></ul>
    </section>

    <section class="card card-secondary">
      <h2>Episodios en radar (segundo plano)</h2>
      <ul id="radar-list" class="list"></ul>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
