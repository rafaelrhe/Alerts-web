<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskMonitor Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>RiskMonitor</h1>
    <p class="subtitle">Executive Risk View · Active & Watchlist</p>
  </header>

  <main>
    <section class="card card-secondary compact-card">
      <h2>Estado del radar</h2>
      <div id="status-grid" class="status-grid"></div>
    </section>

    <section class="split-grid">
      <section class="card block-card">
        <div class="block-head">
          <h2>Active events</h2>
          <span id="active-count" class="tag tag-neutral">0</span>
        </div>
        <ul id="active-events" class="event-tree"></ul>
      </section>

      <section class="card block-card card-secondary">
        <div class="block-head">
          <h2>Watchlist</h2>
          <span id="watchlist-count" class="tag tag-neutral">0</span>
        </div>
        <ul id="watchlist-events" class="event-tree"></ul>
      </section>
    </section>

    <details class="card card-secondary collapsed-history">
      <summary>Closed / lower-priority events (secondary)</summary>
      <ul id="closed-events" class="list compact-list"></ul>
    </details>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
