<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskMonitor Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>RiskMonitor</h1>
  </header>

  <main>
    <section class="card">
      <h2>Estado del radar</h2>
      <div id="status-grid" class="status-grid"></div>
    </section>

    <section class="card card-situation">
      <h2>Qué está pasando</h2>
      <h3 id="situation-headline"></h3>
      <div class="columns">
        <div>
          <h4>Cambios clave</h4>
          <ul id="what-changed" class="situation-list"></ul>
        </div>
        <div>
          <h4>Frentes en seguimiento</h4>
          <ul id="what-open" class="situation-list"></ul>
        </div>
        <div>
          <h4>Foco inmediato</h4>
          <ul id="what-watch" class="situation-list"></ul>
        </div>
      </div>
    </section>

    <section id="daily-report-card" class="card" hidden>
      <h2>Último informe diario</h2>
      <div id="daily-report-content"></div>
    </section>

    <section class="card">
      <h2>Alertas recientes</h2>
      <ul id="alerts-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Episodios / frentes abiertos</h2>
      <ul id="episodes-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Review reciente</h2>
      <ul id="review-list" class="list"></ul>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
